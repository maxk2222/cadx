[project]
name = "meshserver"
version = "0.1.0"
description = "Local image-to-3D mesh generation sidecar (Hunyuan3D / TRELLIS.2 / TripoSG adapters)"
license = "AGPL-3.0-or-later"
authors = [{name = "Maximilian Koch"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "trimesh>=4.0",
    "typer>=0.12",
    "structlog>=24.1",
    "huggingface_hub>=0.24",
    # hard dep: app.py -> llm_proxy -> httpx (OpenAI client + proxy transport)
    "httpx>=0.27",
    # health endpoint, RSS watchdog and memory headroom checks degrade without
    # it — tiny pure wheel, keep it a base dep
    "psutil>=5.9",
    # trimesh splits/sections silently no-op without scipy (graph traversal) —
    # postprocess.clean_mesh floater removal and bench section metrics need it
    "scipy>=1.12",
]

[project.optional-dependencies]
# Apple Silicon: MLX port of Hunyuan3D-2.1 shape stage (install the fork via scripts/install_hunyuan_mlx.sh)
mlx = [
    "mlx>=0.20",
    "safetensors>=0.4",
    "scikit-image>=0.24",
    "PyMCubes>=0.1.6",
    "scipy>=1.12",
]
# Apple Silicon: official Hunyuan3D-2 torch pipeline on MPS (install repo via scripts/install_hunyuan_torch.sh)
mps = [
    "torch>=2.3",
    "diffusers>=0.30,<0.32",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]
# NVIDIA: TRELLIS.2 + TripoSG (heavy deps are installed by Dockerfile.cuda / setup scripts)
cuda = [
    "torch>=2.4",
    "diffusers>=0.30,<0.32",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "rembg>=2.0.57",
]
# AMD (Linux, ROCm): TripoSG + Hunyuan3D-2 torch — same dep set as cuda; the
# HIP-enabled torch itself comes from scripts/install_rocm.sh / Dockerfile.rocm
rocm = [
    "torch>=2.4",
    "diffusers>=0.30,<0.32",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "rembg>=2.0.57",
    "scikit-image>=0.24",  # marching-cubes fallback for the CUDA-only diso ext
]
# background removal only (for adapters that don't bundle rembg)
bg = [
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]
# local LLM serving (kind="llm" adapters): OpenAI-compatible chat completions.
# mlx-lm on Apple Silicon; llama.cpp elsewhere — a system `llama-server` binary
# or LLAMA_SERVER_BIN also works without the python package.
# mlx-lm>=0.30 requires transformers>=5 — incompatible with the transformers<5
# pin of the torch extras sharing this venv, so stay on the last tf4 release.
# The modern multimodal Qwen generation (qwen3_5 / qwen4_exp architectures)
# needs mlx-lm>=0.32 + mlx-vlm — both live in a dedicated mesh_server/.venv-llm
# created by scripts/install_llm.sh; the mlx adapter auto-resolves it.
llm = [
    "mlx-lm>=0.24,<0.30; sys_platform=='darwin'",
    "llama-cpp-python[server]>=0.2.90; sys_platform!='darwin'",
]
# text-to-image: Apple Silicon — FLUX.1-schnell / Qwen-Image-Edit via mflux.
# mflux itself is installed by scripts/install_image_mlx.sh with --no-deps:
# mflux>=0.14 pins transformers>=5.5, which conflicts with the transformers<5
# pin of the torch extras sharing this venv (and older mflux needs mlx<0.31,
# which conflicts with mlx_arsenal>=0.10). The deps below cover what mflux
# needs under transformers 4.x; qwen_edit_mlx patches the tf5-era
# Qwen2Tokenizer workaround so it works on tf4.
image-mlx = [
    "mlx>=0.32",
    "safetensors>=0.4",
    "transformers>=4.45,<5",
    "sentencepiece>=0.2",
    "opencv-python>=4.10",
    "piexif>=1.1",
    "platformdirs>=4.0",
    "toml>=0.10",
]
# text-to-image: CUDA/ROCm/MPS/CPU — FLUX.1-schnell / SDXL / SD1.5 via diffusers
# (matches scripts/install_image_torch.sh — the tf4 stack; diffusers>=0.41 would
# pull huggingface_hub>=1.32 which contradicts the transformers<5 pin)
image-torch = [
    "torch>=2.3",
    "diffusers>=0.30,<0.36",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshserver"]

[project.scripts]
meshserver = "meshserver.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "meshserver"
version = "0.1.0"
description = "Local image-to-3D mesh generation sidecar (Hunyuan3D / TRELLIS.2 / TripoSG adapters)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "trimesh>=4.0",
    "typer>=0.12",
    "structlog>=24.1",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Apple Silicon: MLX port of Hunyuan3D-2.1 shape stage (install the fork via scripts/install_hunyuan_mlx.sh)
mlx = [
    "mlx>=0.20",
    "safetensors>=0.4",
    "scikit-image>=0.24",
    "PyMCubes>=0.1.6",
    "scipy>=1.12",
]
# Apple Silicon: official Hunyuan3D-2 torch pipeline on MPS (install repo via scripts/install_hunyuan_torch.sh)
mps = [
    "torch>=2.3",
    "diffusers>=0.30",
    "transformers>=4.45",
    "accelerate>=0.33",
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]
# NVIDIA: TRELLIS.2 + TripoSG (heavy deps are installed by Dockerfile.cuda / setup scripts)
cuda = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.45",
    "accelerate>=0.33",
    "rembg>=2.0.57",
]
# background removal only (for adapters that don't bundle rembg)
bg = [
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshserver"]

[project.scripts]
meshserver = "meshserver.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "meshserver"
version = "0.1.0"
description = "Local image-to-3D mesh generation sidecar (Hunyuan3D / TRELLIS.2 / TripoSG adapters)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "trimesh>=4.0",
    "typer>=0.12",
    "structlog>=24.1",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Apple Silicon: MLX port of Hunyuan3D-2.1 shape stage (install the fork via scripts/install_hunyuan_mlx.sh)
mlx = [
    "mlx>=0.20",
    "safetensors>=0.4",
    "scikit-image>=0.24",
    "PyMCubes>=0.1.6",
    "scipy>=1.12",
]
# Apple Silicon: official Hunyuan3D-2 torch pipeline on MPS (install repo via scripts/install_hunyuan_torch.sh)
mps = [
    "torch>=2.3",
    "diffusers>=0.30,<0.32",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]
# NVIDIA: TRELLIS.2 + TripoSG (heavy deps are installed by Dockerfile.cuda / setup scripts)
cuda = [
    "torch>=2.4",
    "diffusers>=0.30,<0.32",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "rembg>=2.0.57",
]
# AMD (Linux, ROCm): TripoSG + Hunyuan3D-2 torch — same dep set as cuda; the
# HIP-enabled torch itself comes from scripts/install_rocm.sh / Dockerfile.rocm
rocm = [
    "torch>=2.4",
    "diffusers>=0.30,<0.32",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "rembg>=2.0.57",
    "scikit-image>=0.24",  # marching-cubes fallback for the CUDA-only diso ext
]
# background removal only (for adapters that don't bundle rembg)
bg = [
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]
# local LLM serving (kind="llm" adapters): OpenAI-compatible chat completions.
# mlx-lm on Apple Silicon; llama.cpp elsewhere — a system `llama-server` binary
# or LLAMA_SERVER_BIN also works without the python package.
llm = [
    "httpx>=0.27",
    "mlx-lm>=0.24; sys_platform=='darwin'",
    "llama-cpp-python[server]>=0.2.90; sys_platform!='darwin'",
]
# text-to-image: Apple Silicon — FLUX.1-schnell via mflux (scripts/install_image_mlx.sh)
image-mlx = [
    "mflux>=0.9",
    "mlx>=0.20",
    "safetensors>=0.4",
]
# text-to-image: CUDA/ROCm/MPS/CPU — FLUX.1-schnell / SDXL / SD1.5 via diffusers
# (matches scripts/install_image_torch.sh — the tf4 stack; diffusers>=0.41 would
# pull huggingface_hub>=1.32 which contradicts the transformers<5 pin)
image-torch = [
    "torch>=2.3",
    "diffusers>=0.30,<0.36",
    "transformers>=4.45,<5",
    "huggingface_hub<1",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshserver"]

[project.scripts]
meshserver = "meshserver.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: cadx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadx}
      POSTGRES_DB: ${POSTGRES_DB:-cadx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadx} -d ${POSTGRES_DB:-cadx}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", ""]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: backend
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadx}:${POSTGRES_PASSWORD:-cadx}@postgres:5432/${POSTGRES_DB:-cadx}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      # bootstrap seed only — used once to create the DB runtime row when it
      # does not exist yet; afterwards the DB value wins and this is ignored
      MESH_BASE_URL: ${MESH_BASE_URL:-http://host.docker.internal:8765}
      # keep the rembg u2net model (~170 MB, first bg-removal call) on the
      # data volume so container recreates don't re-download it
      U2NET_HOME: /data/rembg
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [public, internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    build:
      context: backend
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadx}:${POSTGRES_PASSWORD:-cadx}@postgres:5432/${POSTGRES_DB:-cadx}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      # bootstrap seed only — see api service; change it in the Settings UI
      MESH_BASE_URL: ${MESH_BASE_URL:-http://host.docker.internal:8765}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - rembg_models:/root/.rembg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [public, internal]

  cad-executor:
    build:
      context: backend
      target: executor
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadx}:${POSTGRES_PASSWORD:-cadx}@postgres:5432/${POSTGRES_DB:-cadx}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      PYVISTA_OFF_SCREEN: "true"
      # read-only root fs: redirect cache/config dirs into the /tmp tmpfs
      HOME: /tmp
      MPLCONFIGDIR: /tmp/mpl
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # headroom for STL->B-rep sewing + pyvista renders on capped meshes —
    # 6g was hit by the uncapped watertight ladder (283k-face input, rc=137)
    mem_limit: 8g
    cpus: 4

  # GPU mesh generator — only on CUDA hosts; on macOS run it natively instead
  # (make mesh-server). Enable with: docker compose --profile gpu up -d
  mesh-server:
    profiles: ["gpu"]
    build:
      context: mesh_server
      dockerfile: Dockerfile.cuda
    environment:
      MESH_DEVICE: cuda
      MESH_FAKE: ${MESH_FAKE:-}
      HF_HOME: /models/hf
    volumes:
      - mesh_models:/models
    networks: [internal, public]  # internal: reachable by worker; public: HF model downloads

  # AMD variant (Linux + ROCm): docker compose --profile gpu-rocm up -d
  # Requires the amdgpu driver on the host; KFD + DRM render nodes are passed
  # through. Set HSA_OVERRIDE_GFX_VERSION in .env for gfx archs not covered by
  # the torch wheel.
  mesh-server-rocm:
    profiles: ["gpu-rocm"]
    build:
      context: mesh_server
      dockerfile: Dockerfile.rocm
    environment:
      MESH_DEVICE: rocm
      MESH_FAKE: ${MESH_FAKE:-}
      HF_HOME: /models/hf
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
    devices:
      - /dev/kfd
      - /dev/dri
    # no group_add: the container runs as root, and 'video'/'render' group
    # names aren't guaranteed to exist inside the image
    ipc: host  # ROCm shared-memory transport
    security_opt:
      - seccomp=unconfined
    volumes:
      - mesh_models:/models
    networks: [internal, public]

  frontend:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [public]

networks:
  public:
  internal:
    internal: true

volumes:
  pgdata:
  mesh_models:
  rembg_models:

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads: library parts up to 50MB / assets up to 25MB — keep the proxy
    # limit above the API caps so the API's JSON 413 is what reaches clients.
    client_max_body_size 60m;

    # Resolve upstreams at request time so container recreates keep working
    # (127.0.0.11 is the Docker embedded DNS server).
    resolver 127.0.0.11 valid=10s;

    # API + SSE proxy to backend
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: disable buffering/caching
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

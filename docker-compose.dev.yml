name: cadx-dev

# Infra only, for running api/worker/cad-executor natively (see Makefile `dev`).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cadx
      POSTGRES_PASSWORD: cadx
      POSTGRES_DB: cadx
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadx -d cadx"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:

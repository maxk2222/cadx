[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cadx_native"
version = "0.1.0"
description = "Native geometry-query and FEM kernels for cadx (optional; Python fallback)"
requires-python = ">=3.12"

[tool.maturin]
features = ["pyo3/extension-module"]
strip = true

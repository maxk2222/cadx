[project]
name = "cadx"
version = "0.1.0"
description = "LLM-driven CAD agent: images + text -> parametric build123d models for 3D printing & CNC"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<0.150",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "greenlet>=3.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=2.0,<3.0",
    "build123d>=0.13,<0.14",
    "bd_warehouse>=0.4,<0.5",
    "trimesh>=4.0",
    "networkx>=3.0",
    "lxml>=5.0",
    "fast-simplification>=0.1.7,<0.3",
    "manifold3d>=2.3,<4",
    "scikit-image>=0.24",  # marching-cubes density extraction
    "shapely>=2.0",
    "rtree>=1.0",
    "pyvista>=0.44",
    "vtk>=9.3,<10",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rembg[cpu]>=2.0.57",  # lazy-imported; u2net model downloads on first bg-removal call
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadx"]

[project.scripts]
cadx = "cadx.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "C90", "SIM", "RET", "PTH", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"cadx/api/routers/*.py" = ["B008"]
"cadx/cli.py" = ["B008"]
"tests/fixtures/*.py" = ["F401", "F403", "F405", "PTH", "SIM117"]
"alembic/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
packages = ["cadx"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

# pyvista stubs mis-decorate plotting methods (false positives)
[[tool.mypy.overrides]]
module = "cadx.cad.render"
disable_error_code = ["call-arg", "arg-type"]

# bd_warehouse has no type stubs for its class-level catalogs
[[tool.mypy.overrides]]
module = "cadx.cad.catalog"
disable_error_code = ["call-arg", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "render: tests that need offscreen rendering",
    "slow: long-running tests",
]

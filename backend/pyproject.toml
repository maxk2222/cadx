[project]
name = "cadx"
version = "0.1.0"
description = "LLM-driven CAD agent: images + text -> parametric build123d models for 3D printing & CNC"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<0.150",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "greenlet>=3.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=2.0,<3.0",
    "build123d>=0.13,<0.14",
    "bd_warehouse>=0.4,<0.5",
    "quiddity>=0.3.11,<0.4",  # optional at runtime — feature recognition enrichment
    "pyransac3d>=0.7,<0.8",  # optional at runtime — primitive segmentation for cad/reconstruct composite parts; lazy-imported so a missing/broken install degrades to "organic"
    "trimesh>=4.0",
    "networkx>=3.0",
    "lxml>=5.0",
    "fast-simplification>=0.1.7,<0.3",
    "manifold3d>=2.3,<4",
    "scikit-image>=0.24",  # marching-cubes density extraction
    "shapely>=2.0",
    "rtree>=1.0",
    "pyvista>=0.44",
    "vtk>=9.3,<10",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "cryptography>=42",  # Fernet at-rest encryption for DB-persisted secrets
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rembg[cpu]>=2.0.57",  # lazy-imported; u2net model downloads on first bg-removal call
    "nlopt>=2.7",
    "mcp>=2.2,<3",  # MCP server core — exposes deterministic cadx tools to external agents
]

[project.optional-dependencies]
# GPL — optional repair engine for cad/mesh_ops.py (alpha_wrap, isotropic
# remesh, quadric decimate, taubin); lazy-imported via cad/mesh_repair_pml.py
repair = [
    "pymeshlab>=2023.12",
]
# optional FEM solver tier — both lazy-imported with graceful fallbacks:
#   scikit-sparse: CHOLMOD sparse Cholesky for the direct path. Pinned to
#     an unreleased git SHA: the last PyPI release (0.5.0, 2023) ships a
#     stale generated cholmod.c that cannot compile against SuiteSparse≥5.4
#     (sbound→dbound field rename); upstream HEAD carries the compat pxd.
#     Needs SuiteSparse headers + a compiler + git at build time — apt:
#     libsuitesparse-dev build-essential git (executor image provides them).
#   pyamg: smoothed-aggregation AMG preconditioner for CG above
#     fem_spsolve_dofs — the >120k-DOF cliff becomes minutes, not hours
fem = [
    "scikit-sparse @ git+https://github.com/scikit-sparse/scikit-sparse@5f4772d01053bafb534672191457beb2d2a8c21c",
    "pyamg>=5.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the [fem] extra pins scikit-sparse to a git SHA (no released version
# compiles against modern SuiteSparse — see the optional-dependencies note)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cadx"]

[project.scripts]
cadx = "cadx.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "C90", "SIM", "RET", "PTH", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"cadx/api/routers/*.py" = ["B008"]
"cadx/cli.py" = ["B008"]
"tests/fixtures/*.py" = ["F401", "F403", "F405", "PTH", "SIM117"]
"alembic/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
packages = ["cadx"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

# pyvista stubs mis-decorate plotting methods (false positives)
[[tool.mypy.overrides]]
module = "cadx.cad.render"
disable_error_code = ["call-arg", "arg-type"]

# bd_warehouse has no type stubs for its class-level catalogs
[[tool.mypy.overrides]]
module = "cadx.cad.catalog"
disable_error_code = ["call-arg", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "render: tests that need offscreen rendering",
    "slow: long-running tests",
]
